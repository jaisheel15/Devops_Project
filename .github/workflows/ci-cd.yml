name: CI/CD Pipeline & DevSecOps

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  # -------------------------------------------------------------
  # Job 1: Backend Automated Pytest Suite & Code Quality Gate
  # -------------------------------------------------------------
  backend-test:
    name: Backend Pytest & Code Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest -v --strict-markers

  # -------------------------------------------------------------
  # Job 2: Frontend Build & Compilation Check
  # -------------------------------------------------------------
  frontend-build:
    name: Frontend Build & Asset Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Node Dependencies
        run: |
          npm ci || npm install

      - name: Build React / Vite Bundle
        run: |
          npm run build

  # -------------------------------------------------------------
  # Job 3: DevSecOps Vulnerability Scan (Trivy) & GHCR Publishing
  # -------------------------------------------------------------
  build-scan-publish:
    name: Build Containers, Trivy Scan & Push to GHCR
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build Local Images for Scanning
      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: bookverse-backend:local

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: bookverse-frontend:local

      # DevSecOps: Trivy Vulnerability Scans (Fails pipeline on HIGH or CRITICAL CVEs)
      - name: Trivy Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bookverse-backend:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Trivy Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bookverse-frontend:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Publish Docker Images to GHCR with Commit SHA Tag
      - name: Lowercase Repository Name for GHCR
        id: repo-names
        run: |
          echo "backend_img=${REGISTRY}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')-backend" >> $GITHUB_OUTPUT
          echo "frontend_img=${REGISTRY}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')-frontend" >> $GITHUB_OUTPUT

      - name: Push Backend Image to GHCR (SHA Tagged)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.repo-names.outputs.backend_img }}:${{ github.sha }}
            ${{ steps.repo-names.outputs.backend_img }}:latest

      - name: Push Frontend Image to GHCR (SHA Tagged)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.repo-names.outputs.frontend_img }}:${{ github.sha }}
            ${{ steps.repo-names.outputs.frontend_img }}:latest
