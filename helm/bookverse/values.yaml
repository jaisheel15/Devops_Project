global:
  environment: production
  namespace: bookverse

backend:
  replicaCount: 2
  image:
    repository: ghcr.io/jaisheel15/devops_project-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  env:
    APP_NAME: "BookVerse API"
    APP_ENV: "production"
    DATABASE_URL: "postgresql+psycopg2://postgres:postgrespassword@bookverse-postgres:5432/bookverse_db"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 15
      periodSeconds: 10
    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 5

frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/jaisheel15/devops_project-frontend
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

database:
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
  service:
    port: 5432
  storage:
    size: 2Gi
  postgresUser: postgres
  postgresPassword: postgrespassword
  postgresDb: bookverse_db

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
  hosts:
    - host: bookverse.local
      paths:
        - path: /api
          pathType: Prefix
          service: backend
          port: 8000
        - path: /health
          pathType: Exact
          service: backend
          port: 8000
        - path: /metrics
          pathType: Exact
          service: backend
          port: 8000
        - path: /
          pathType: Prefix
          service: frontend
          port: 80
